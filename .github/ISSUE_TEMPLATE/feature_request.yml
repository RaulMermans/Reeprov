name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case
      description: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How should this work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any other approaches or workarounds you've explored?
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Capture / Tracing
        - Replay
        - Fork / Lineage
        - Run Comparison
        - Context / Memory Intelligence
        - Evaluation
        - Regression
        - Studio UI
        - CLI
        - TypeScript SDK
        - Python SDK
        - Documentation
        - Security
        - Other
