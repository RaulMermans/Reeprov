name: Release Publish (Manual Approval Gated)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.0-beta.1)'
        required: true
        type: string
      dry_run:
        description: 'Dry run (do not publish to external registries)'
        required: true
        type: boolean
        default: true
      publish_verified_beta:
        description: 'Publish the verified v0.1.0-beta.1 GitHub release artifacts to PyPI'
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  validate:
    if: ${{ !inputs.publish_verified_beta }}
    name: Validate Release Candidate & Build Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install root dependencies
        run: npm ci

      - name: Deterministic Release Version Consistency
        run: node scripts/validate-release-version.mjs --version ${{ inputs.version }}

      - name: Run CI Suite
        run: npm run ci

      - name: Audit Private Paths
        run: npm run audit:paths

      - name: Build & Package TypeScript SDK
        run: |
          cd packages/client-typescript
          npm install
          npm run build
          npm test
          npm pack

      - name: Fresh Project TypeScript Install Proof
        run: |
          mkdir /tmp/fresh-ts-app
          cd /tmp/fresh-ts-app
          npm init -y
          TARBALL=$(ls $GITHUB_WORKSPACE/packages/client-typescript/reeprov-client-*.tgz)
          npm install "$TARBALL"
          node -e "
            const { ReeprovClient } = require('@reeprov/client');
            const client = new ReeprovClient({ endpoint: 'http://127.0.0.1:3000', apiKey: 'test' });
            console.log('TypeScript SDK successfully verified from packaged tarball');
          "

      - name: Build & Package Python SDK
        run: |
          cd packages/client-python
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      - name: Fresh Virtualenv Python Install Proof
        run: |
          python -m venv /tmp/fresh-py-env
          source /tmp/fresh-py-env/bin/activate
          WHEEL=$(ls $GITHUB_WORKSPACE/packages/client-python/dist/*.whl)
          pip install "$WHEEL"
          python -c "
          from reeprov_client import ReeprovClient
          client = ReeprovClient(url='http://127.0.0.1:3000', ingest_key='test')
          print('Python SDK successfully verified from built wheel')
          "

      - name: Upload TypeScript SDK Tarball
        uses: actions/upload-artifact@v4
        with:
          name: typescript-sdk-tarball
          path: packages/client-typescript/reeprov-client-*.tgz
          if-no-files-found: error

      - name: Upload Python SDK Dist
        uses: actions/upload-artifact@v4
        with:
          name: python-sdk-dist
          path: packages/client-python/dist/*
          if-no-files-found: error

  publish-packages:
    if: ${{ !inputs.publish_verified_beta && github.ref == 'refs/heads/main' }}
    name: Publish Packages (Approval Gated)
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.21.1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download TypeScript SDK Tarball
        uses: actions/download-artifact@v4
        with:
          name: typescript-sdk-tarball
          path: packages/client-typescript

      - name: Download Python SDK Dist
        uses: actions/download-artifact@v4
        with:
          name: python-sdk-dist
          path: packages/client-python/dist

      - name: Promote & Publish TypeScript SDK
        run: |
          TARBALL=$(ls packages/client-typescript/reeprov-client-*.tgz)
          echo "Promoting pre-built verified tarball: $TARBALL"
          if [ "${{ inputs.dry_run }}" = "false" ]; then
            npm publish "$TARBALL" --access public --provenance --tag latest
          else
            npm publish "$TARBALL" --access public --dry-run
          fi

      - name: Verify Python SDK artifacts
        run: |
          python -m pip install --upgrade twine
          twine check packages/client-python/dist/*

      - name: Publish Python SDK through PyPI trusted publisher
        if: ${{ inputs.dry_run == false }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/client-python/dist/

      - name: Create GitHub Release
        if: ${{ inputs.dry_run == false }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Reeprov v${{ inputs.version }}
          body_path: CHANGELOG.md
          prerelease: true
          files: |
            packages/client-typescript/reeprov-client-*.tgz
            packages/client-python/dist/*

  publish-verified-beta:
    if: ${{ inputs.publish_verified_beta && inputs.version == '0.1.0-beta.1' && github.ref == 'refs/heads/main' }}
    name: Publish Verified Beta Artifacts
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download published Python release artifacts
        run: |
          mkdir -p release-dist
          gh release download v0.1.0-beta.1 --repo "$GITHUB_REPOSITORY" --dir release-dist \
            --pattern 'reeprov_client-0.1.0b1-py3-none-any.whl' \
            --pattern 'reeprov_client-0.1.0b1.tar.gz'
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify exact release artifact hashes
        run: |
          printf '%s  %s\n' \
            '3ce573b0d9de7674cf49e3fdcd4b98b53b0d56dbd535c9f818582df01f401be3' 'release-dist/reeprov_client-0.1.0b1-py3-none-any.whl' \
            'b6c54503fb0565646ab8c3f3e1e83457b4544e9f642a891dcaf8efd89fc04341' 'release-dist/reeprov_client-0.1.0b1.tar.gz' \
            | sha256sum --check

      - name: Publish verified files to PyPI
        if: ${{ inputs.dry_run == false }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: release-dist/
