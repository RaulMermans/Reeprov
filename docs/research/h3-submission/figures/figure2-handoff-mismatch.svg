  <text class="danger" x="26"  y="393">Acc: 1/6 (16.7%) | Recall: 0/4</text>
  <text class="td-err" x="250" y="385">supported [X]</text>
  <text class="td-ok"  x="378" y="385">supported [OK]</text>
