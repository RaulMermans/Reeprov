services:
  reeprov:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reeprov-studio
    restart: unless-stopped
    ports:
      # Bind to loopback interface by default for secure local hosting.
      # To expose across a private network, change to e.g. "3000:3000"
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - REEPROV_MODE=self_hosted
      - REEPROV_HOME=/home/nextjs/.reeprov
      - REEPROV_STORE_DIR=/home/nextjs/.reeprov
      # Mandatory for self-hosted mode — configure in your environment or .env.local
      - REEPROV_ACCESS_KEY=${REEPROV_ACCESS_KEY:?REEPROV_ACCESS_KEY must be set}
      - REEPROV_INGEST_KEY=${REEPROV_INGEST_KEY:?REEPROV_INGEST_KEY must be set}
      # Optional: connect to postgres service if enabled below
      # - DATABASE_URL=postgresql://reeprov:reeprov_secret@postgres:5432/reeprov?sslmode=disable
    volumes:
      - reeprov-data:/home/nextjs/.reeprov
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Optional PostgreSQL backend (uncomment if you need Postgres persistence)
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: reeprov-postgres
  #   restart: unless-stopped
  #   environment:
  #     - POSTGRES_DB=reeprov
  #     - POSTGRES_USER=reeprov
  #     - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-reeprov_secret}
  #   volumes:
  #     - reeprov-db:/var/lib/postgresql/data
  #   ports:
  #     - "127.0.0.1:5432:5432"

volumes:
  reeprov-data:
    name: reeprov-data
  # reeprov-db:
  #   name: reeprov-db
