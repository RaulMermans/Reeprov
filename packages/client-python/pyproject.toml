[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reeprov-client"
version = "0.1.0b1"
description = "Python client SDK for Reeprov — local-first debugging and reproducibility infrastructure for AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Reeprov Contributors"}
]
keywords = ["reeprov", "ai-agents", "debugging", "reproducibility", "tracing", "telemetry", "evals"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/RaulMermans/Reeprov"
Repository = "https://github.com/RaulMermans/Reeprov.git"
Documentation = "https://github.com/RaulMermans/Reeprov/tree/main/packages/client-python"

[tool.setuptools.packages.find]
where = ["src"]
