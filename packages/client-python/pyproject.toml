[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentpulse-client"
version = "0.1.0b1"
description = "Python client SDK for AgentPulse — local-first agent debugging and reproducibility."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "AgentPulse Contributors"}
]
keywords = ["agentpulse", "ai-agents", "debugging", "tracing", "telemetry", "evals"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/raulm/AgentPulse"
Repository = "https://github.com/raulm/AgentPulse.git"
Documentation = "https://github.com/raulm/AgentPulse/tree/main/packages/client-python"

[tool.setuptools.packages.find]
where = ["src"]
